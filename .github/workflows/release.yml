name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch_label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch_label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch_label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch_label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch_label: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Sync version from Git tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME#v}"
            echo "Syncing version to ${RAW_TAG} from tag ${GITHUB_REF_NAME}"
            npm pkg set version="${RAW_TAG}"
          fi
          node scripts/sync-version.mjs

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            zip

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Package macOS portable .app.zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ matrix.target }}" == aarch64* ]]; then
            ARCH="aarch64"
          else
            ARCH="x64"
          fi
          if [ -d "$BUNDLE_DIR/macos/pdf-presenter.app" ]; then
            mkdir -p "$BUNDLE_DIR/portable-macos"
            ditto -c -k --sequesterRsrc --keepParent \
              "$BUNDLE_DIR/macos/pdf-presenter.app" \
              "$BUNDLE_DIR/portable-macos/pdf-presenter_${VERSION}_${ARCH}_macos-portable.app.zip"
          fi

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          if [ "${RUNNER_OS}" == "Windows" ]; then
            cp "$BUNDLE_DIR"/nsis/*.exe release-assets/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/msi/*.msi release-assets/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/portable/*-portable.exe release-assets/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/portable/*-portable.zip release-assets/ 2>/dev/null || true
          elif [ "${RUNNER_OS}" == "macOS" ]; then
            cp "$BUNDLE_DIR"/dmg/*.dmg release-assets/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/portable-macos/*.app.zip release-assets/ 2>/dev/null || true
          elif [ "${RUNNER_OS}" == "Linux" ]; then
            cp "$BUNDLE_DIR"/deb/*.deb release-assets/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/rpm/*.rpm release-assets/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/appimage/*.AppImage release-assets/ 2>/dev/null || true
            cp "$BUNDLE_DIR"/portable/*-portable.zip release-assets/ 2>/dev/null || true
          fi

          ls -lh release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch_label }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Presenter ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
